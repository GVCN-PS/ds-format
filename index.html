
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVCN Driving Exam Results</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px 15px;
    color: #222;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    border-top: 6px solid #6495b0;
}

header {
    text-align: center;
}

.logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

h1 {
    font-size: 24px;
}

h2 {
    color: #6495b0;
    border-bottom: 2px solid #6495b0;
    padding-bottom: 8px;
}

textarea {
    width: 100%;
    height: 400px;
    padding: 12px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: monospace;
    resize: vertical;
}

button {
    background: #6495b0;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 12px;
}

button:hover {
    background: #47748e;
}
</style>
</head>

<body>

<div class="container">

<header>
    <img src="image-1024.jpg" class="logo" alt="WisDOT Logo">
    <h1>GVCN Driving School</h1>
    <p>Division Exam Results Format</p>
</header>

<h2>Driving Exam Results</h2>

<textarea id="results"># Driving Exam Results

**PASS**
- (User) - **(Mistake points allocated)**
-# Notes (Optional)
- (User) - **(Mistake points allocated)**
-# Notes (Optional)
- (User) - **(Mistake points allocated)**
-# Notes (Optional)

---

**FAIL**
- (User) - **(Mistake points allocated / Instant Failure)**
-# Notes (Optional)
- (User) - **(Mistake points allocated / Instant Failure)**
-# Notes (Optional)
- (User) - **(Mistake points allocated / Instant Failure)**
-# Notes (Optional)

*Congratulations for everyone who participated. Do not worry, this will not affect your future attempts at the Driving School Sessions.*</textarea>

<button onclick="copyResults()">Copy Results</button>

</div>

<script>
function copyResults() {
    navigator.clipboard.writeText(
        document.getElementById("results").value
    ).then(() => alert("Results copied!"));
}
</script>

</body>
</html>
