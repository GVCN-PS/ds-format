
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GVCN | Driving Exam Results</title>

<link rel="icon" type="image/jpeg" href="image-1024.jpg">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 35px 15px;
    font-family: Arial, sans-serif;
    background: #000000;
    color: #ffffff;
}

.container {
    max-width: 750px;
    margin: auto;
}

header {
    margin-bottom: 30px;
}

header h1 {
    font-size: 28px;
    margin-bottom: 8px;
}

header p {
    color: #999999;
    font-size: 14px;
}

.card {
    background: #161616;
    border: 1px solid #292929;
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 20px;
}

h2 {
    font-size: 19px;
    margin-top: 0;
    color: #6495b0;
}

textarea {
    width: 100%;
    height: 420px;
    padding: 15px;
    background: #0b0b0b;
    color: #eeeeee;
    border: 1px solid #333333;
    border-radius: 7px;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
}

textarea:focus {
    border-color: #6495b0;
}

button {
    background: #6495b0;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    padding: 12px 20px;
    margin-top: 13px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #47748e;
}

footer {
    text-align: center;
    color: #777777;
    font-size: 12px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Driving Exam Results</h1>
    <p>GVCN · Wisconsin Department of Transportation</p>
</header>

<div class="card">

    <h2>Exam Results Format</h2>

    <textarea id="results"># Driving Exam Results

**PASS**
- (User) - **(Mistake points allocated)**
-# Notes (Optional)
- (User) - **(Mistake points allocated)**
-# Notes (Optional)
- (User) - **(Mistake points allocated)**
-# Notes (Optional)

---

**FAIL**
- (User) - **(Mistake points allocated / Instant Failure)**
-# Notes (Optional)
- (User) - **(Mistake points allocated / Instant Failure)**
-# Notes (Optional)
- (User) - **(Mistake points allocated / Instant Failure)**
-# Notes (Optional)

*Congratulations for everyone who participated. Do not worry, this will not affect your future attempts at the Driving School Sessions.*</textarea>

    <button onclick="copyResults()">Copy Format</button>

</div>

<footer>
    GVCN · DOT Transportation Division
</footer>

</div>

<script>
function copyResults() {
    navigator.clipboard.writeText(
        document.getElementById("results").value
    ).then(() => {
        alert("Format copied successfully!");
    }).catch(() => {
        const text = document.getElementById("results");
        text.select();
        document.execCommand("copy");
        alert("Format copied!");
    });
}
</script>

</body>
</html>
